name: Build VST3 Simple
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup CMake 3.28
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.2'
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Package
        shell: pwsh
        run: |
          $f=Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select -First 1
          Write-Host "Found: $f"
          if($f){ Compress-Archive -Path $f.FullName -DestinationPath SongCreator.vst3.zip -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: SongCreator-VST3-Simple
          path: |
            SongCreator.vst3.zip
            build/**/*.vst3
          if-no-files-found: warn
