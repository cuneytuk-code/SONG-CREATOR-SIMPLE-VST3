name: Build VST3 Simple
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --parallel 4
      - name: Package VST3
        shell: pwsh
        run: |
          $vst3Folder = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($vst3Folder) {
            $resDir = Join-Path $vst3Folder.FullName "Contents\Resources"
            New-Item -ItemType Directory -Force -Path $resDir | Out-Null
            Copy-Item -Path "Resources\index.html" -Destination $resDir -Force
            Compress-Archive -Path "$($vst3Folder.FullName)" -DestinationPath "SongCreator.vst3.zip" -Force
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongCreator-VST3-Simple
          path: |
            SongCreator.vst3.zip
            build/**/*.vst3
          if-no-files-found: warn
